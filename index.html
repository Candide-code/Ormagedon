<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ormagedon</title>
  <meta name="description" content="Roadmap de projets : tableau de bord, matrice, calendrier.">
  <!-- Icône de l'onglet (dessin, avec une image de secours pour les vieux navigateurs) -->
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icones/icone-192.png" type="image/png" sizes="192x192">
  <!-- Carte d'identité de l'app installable (nom, couleurs, icônes) -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Couleur de la barre du navigateur / du téléphone (noir de l'app) -->
  <meta name="theme-color" content="#0d0d10">
  <!-- iPhone : icône et nom sur l'écran d'accueil, app sans barre d'adresse,
       barre du haut transparente (l'heure et la batterie s'affichent en blanc sur le fond noir ;
       le contenu ne passe pas dessous grâce aux zones sûres, voir css/base.css) -->
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ormagedon">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/jalons.css">
  <link rel="stylesheet" href="css/categories.css">
  <link rel="stylesheet" href="css/taches.css">
  <link rel="stylesheet" href="css/matrice.css">
  <link rel="stylesheet" href="css/calendrier.css">
  <link rel="stylesheet" href="css/fiche.css">
  <link rel="stylesheet" href="css/projets.css">
  <link rel="stylesheet" href="css/reglages.css">
  <link rel="stylesheet" href="css/tactile.css">
</head>
<body>
  <header class="entete">
    <div class="entete-gauche">
      <!-- Logo : l'anneau-jalon remplace le « O ». Clic = retour à « Mes projets » -->
      <h1 class="logo"><a href="#projets" class="logo-lien" title="Mes projets" aria-label="Ormagedon, revenir à Mes projets"><svg class="logo-o" viewBox="10 8 46 46" aria-hidden="true"><circle cx="32" cy="32" r="17" fill="none" style="stroke: var(--violet)" stroke-width="7"/><circle cx="44" cy="20" r="6.5" style="fill: var(--texte); stroke: var(--fond)" stroke-width="3"/></svg><span aria-hidden="true">rmagedon</span></a></h1>
      <p class="discret" id="sous-titre"></p>
    </div>
    <div class="entete-droite">
      <div class="compte" id="compte" aria-live="polite"></div>
      <!-- Icône des Réglages du projet ouvert (roue dentée) : ouvre le rideau des Réglages -->
      <button type="button" class="reglages-lien" id="reglages-bouton" title="Réglages" aria-label="Réglages du projet" aria-controls="reglages" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <nav class="onglets" aria-label="Vues">
    <button class="onglet actif" data-vue="accueil" aria-current="page">Tableau de bord</button>
    <button class="onglet" data-vue="matrice">Matrice</button>
    <button class="onglet" data-vue="calendrier">Calendrier</button>
  </nav>

  <main id="contenu"></main>

  <footer class="pied">
    <span class="etat" id="etat"><span class="pastille"></span><span id="etat-texte">Ouverture…</span></span>
    <span class="discret" id="maj"></span>
  </footer>

  <div class="voile" id="voile"></div>
  <aside class="fiche" id="fiche" aria-hidden="true" aria-label="Fiche de la tâche">
    <div id="fiche-contenu"></div>
  </aside>
  <aside class="rideau" id="reglages" aria-hidden="true" aria-label="Réglages du projet">
    <div id="reglages-contenu"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
