<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Même icône sur un fond carré plein, dessin un peu réduit (x 0,82) :
       Android découpe l'icône en rond ou en carré arrondi (« maskable »), l'iPhone arrondit lui-même les coins.
       Le dessin reste dans le cercle central (80 %) que les téléphones ne coupent jamais. -->
  <rect width="64" height="64" fill="#16161b"/>
  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <circle cx="32" cy="32" r="16" fill="none" stroke="#8b5cf6" stroke-width="7"/>
    <circle cx="43.3" cy="20.7" r="6.5" fill="#ececf1" stroke="#16161b" stroke-width="3"/>
  </g>
</svg>
